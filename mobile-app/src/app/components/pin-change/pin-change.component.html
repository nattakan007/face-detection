<ion-header>
  <ion-toolbar>
    <ion-title>เปลี่ยนข้อมูลเข้าสู่ระบบ</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="pin-change-container">
    <div class="info-section">
      <ion-icon name="key-outline" color="primary"></ion-icon>
      <p>เปลี่ยนชื่อผู้ใช้และรหัสผ่านสำหรับเข้าระบบ Admin</p>
    </div>

    <!-- Error Message -->
    <div class="error-message" *ngIf="error">
      <ion-icon name="alert-circle" color="danger"></ion-icon>
      <span>{{ error }}</span>
    </div>

    <!-- Current Password -->
    <ion-item>
      <ion-label position="stacked"
        >รหัสผ่านปัจจุบัน <span class="required">*</span></ion-label
      >
      <ion-input
        [type]="showCurrentPassword ? 'text' : 'password'"
        [(ngModel)]="currentPassword"
        placeholder="ใส่รหัสผ่านปัจจุบัน"
        autocomplete="current-password"
      >
      </ion-input>
    </ion-item>

    <!-- New Username -->
    <ion-item>
      <ion-label position="stacked"
        >ชื่อผู้ใช้ / บริษัท <span class="required">*</span></ion-label
      >
      <ion-input
        type="text"
        [(ngModel)]="newUsername"
        placeholder="ชื่อผู้ใช้หรือชื่อบริษัท"
        autocapitalize="off"
      >
      </ion-input>
    </ion-item>

    <!-- New Password -->
    <ion-item>
      <ion-label position="stacked"
        >รหัสผ่านใหม่ <span class="required">*</span></ion-label
      >
      <ion-input
        [type]="showNewPassword ? 'text' : 'password'"
        [(ngModel)]="newPassword"
        placeholder="รหัสผ่านใหม่ (อย่างน้อย 4 ตัว)"
        autocomplete="new-password"
      >
      </ion-input>
    </ion-item>

    <!-- Confirm New Password -->
    <ion-item>
      <ion-label position="stacked"
        >ยืนยันรหัสผ่านใหม่ <span class="required">*</span></ion-label
      >
      <ion-input
        [type]="showNewPassword ? 'text' : 'password'"
        [(ngModel)]="confirmPassword"
        placeholder="ใส่รหัสผ่านใหม่อีกครั้ง"
        autocomplete="new-password"
      >
      </ion-input>
    </ion-item>

    <!-- Buttons -->
    <div class="button-group">
      <ion-button
        expand="block"
        (click)="submit()"
        [disabled]="
          !currentPassword || !newUsername || !newPassword || !confirmPassword
        "
      >
        บันทึกการเปลี่ยนแปลง
      </ion-button>
      <ion-button expand="block" fill="outline" (click)="cancel()">
        ยกเลิก
      </ion-button>
    </div>

    <!-- Info Box -->
    <div class="info-box">
      <ion-icon name="information-circle-outline"></ion-icon>
      <div class="info-text">
        <p><strong>ข้อกำหนด:</strong></p>
        <ul>
          <li>รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร</li>
          <li>ชื่อผู้ใช้ใช้เป็นชื่อโปรไฟล์บริษัท</li>
        </ul>
      </div>
    </div>
  </div>
</ion-content>
