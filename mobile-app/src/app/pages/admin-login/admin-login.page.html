<ion-content [fullscreen]="true">
  <div class="login-container">
    <!-- Back Button -->
    <div class="login-header">
      <ion-button fill="clear" (click)="goBack()" class="back-button">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

    <!-- Lock Icon -->
    <div class="lock-section">
      <div
        class="lock-icon-wrapper"
        [class.error]="isError"
        [class.success]="isSuccess"
      >
        <ion-icon [name]="isSuccess ? 'lock-open' : 'lock-closed'"></ion-icon>
      </div>
      <h1 class="login-title">ระบบผู้ดูแล</h1>
      <p class="login-subtitle">กรุณาเข้าสู่ระบบเพื่อจัดการ</p>
    </div>

    <!-- Login Form -->
    <div class="login-form">
      <div class="input-group">
        <ion-icon name="person-outline" class="input-icon"></ion-icon>
        <input
          type="text"
          [(ngModel)]="username"
          placeholder="ชื่อผู้ใช้ / บริษัท"
          class="login-input"
          [class.error]="isError"
          (keyup.enter)="focusPassword()"
          autocapitalize="off"
          autocomplete="username"
        />
      </div>
      <div class="input-group">
        <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
        <input
          #passwordInput
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="รหัสผ่าน"
          class="login-input"
          [class.error]="isError"
          (keyup.enter)="login()"
          autocomplete="current-password"
        />
        <ion-icon
          [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
          class="toggle-password"
          (click)="showPassword = !showPassword"
        ></ion-icon>
      </div>
    </div>

    <!-- Error Message -->
    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

    <!-- Login Button -->
    <ion-button
      expand="block"
      (click)="login()"
      [disabled]="isProcessing || !username || !password"
      class="login-button"
      color="primary"
    >
      <ion-spinner
        *ngIf="isProcessing"
        name="crescent"
        slot="start"
      ></ion-spinner>
      <span *ngIf="!isProcessing">เข้าสู่ระบบ</span>
      <span *ngIf="isProcessing">กำลังตรวจสอบ...</span>
    </ion-button>

    <!-- Default Credentials Hint -->
    <p class="pin-hint">ทดสอบ: sailor / admin123</p>
  </div>
</ion-content>
