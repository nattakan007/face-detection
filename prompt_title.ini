; ===== ปัญหาเดิม (v2.0.4) - แก้ไขแล้ว =====
; 1.คอนเซ็ปการสแกนใบหน้าเข้างาน หากเปรียบเทียบใบหน้าแล้วไม่ว่าจะ
; ตรงหรือไม่ตรงกับข้อมูลที่มีในระบบ ให้ popup แจ้งเตือนข้อมูล แล้วปรับฟังชันสแกนไปสถานะแรก
; คือกดปุ่ม "สแกนใบหน้า" เพื่อเริ่ม
; 2.คอนเซ็ปต์การเข้างานด้วยตัวเอง ทำคล้ายการลงทะเบียนใบหน้า 
; เพียงแต่กรอกแค่ชื่อ แล้วให้กล้องจับภาพใบหน้าเพื่อบันทึกข้อมูล
; 3.ต้องการบาลานซ์ UI หน้าหลักให้สมดุลใน 1 หน้าจอ
; 4.หน้าหลักปุ่มประวัติที่เพิ่มมาทำให้หน้า UI ไม่สมดุลควรปรับปุ่มให้มีแถวละ 2 ปุ่ม และ
; หน้าประวัติไม่แสดงข้อมูลชื่อหรือรหัสพนักงาน ควรแสดงหากเปรียบเทียบแล้วว่ามีในระบบ
; 5.ปุ่มดูมีขนาดใหญ่เกินไป ควรปรับให้น่าสนใจและเหมาะสมกับขนาดหน้าจอมือถือ



; ===== ปัญหา (v2.0.5) =====
; 1.หน้าลงทะเบียนควรเพิ่มหมายเหตุ require ว่าให้มีข้อมูลไหนบ้าง เช่น ชื่อพนักงาน , รูปถ่ายใบหน้า
; 2.การแก้ไข "กลับไปสแกนอัตโนมัติหลัง popup" แก้ไขไม่ถูกต้องคอนเซ็ปต์ที่ต้องการคือ 
; เมื่อการสแกนใบหน้าอัตโนมัติเสร็จ ห้ามถ่ายซ้ำ ทำให้ข้อมูลซ้ำซ้อน ควรปิดฟังชันสแกนหลังถ่ายภาพสำเร็จ 
; แล้วให้แสดงปุ่มสแกนใบหน้าสีฟ้าเพื่อเริ่มการสแกนใหม่แทน
